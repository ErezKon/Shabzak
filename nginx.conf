events{}

http {

    include /etc/nginx/mime.types;

    # Docker's embedded DNS: the API and the agent are looked up when a request arrives (cached 10 s), so nginx starts
    # while they are still down and follows a container that was recreated with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {

        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        # Relative redirects: an absolute one would name port 80, not the published port (5230).
        absolute_redirect off;

        # The prerendered routes are folders (login/index.html, ...): serve their page directly, without the 301 to
        # "/login/" that "$uri/" causes; every other path gets the app shell (client-side routing).
        location / {
                try_files $uri $uri/index.html /index.html;
        }

        # ShabzakAPI (environment.prod.ts serverURL "/api"); the path is passed on unchanged.
        location /api/ {
            set $shabzak_api http://shabzak-api:8080;
            proxy_pass $shabzak_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Mission/AutoAssign answers only when its run ends (up to 15 minutes, the agent's AUTO_ASSIGN_TIMEOUT_MS).
            proxy_read_timeout 900s;
            # Kestrel's default request size limit, so the proxy never refuses a request the API accepts.
            client_max_body_size 30m;
        }

        # ShabzakAgent, the AI chat assistant (environment.prod.ts agentURL "/agent/api"): /agent/<path> -> agent /<path>.
        location /agent/ {
            set $shabzak_agent http://shabzak-agent:3000;
            rewrite ^/agent(/.*)$ $1 break;
            proxy_pass $shabzak_agent;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Server-Sent Events: pass every event on as it arrives. The agent sends a ping every 15 s, also during long runs.
            proxy_buffering off;
            proxy_read_timeout 300s;
            # The agent is down or unreachable: answer like the agent does, so the chat shows its "unavailable" message.
            error_page 502 503 504 = @agent_unavailable;
        }

        location @agent_unavailable {
            default_type application/json;
            return 502 '{"code":"upstream_error","message":"The Shabzak assistant service is not reachable."}';
        }
    }
}
